name: Build Synapse AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable signing key
        if: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/synapse-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/synapse-signing/release.jks"
          test -s "$RUNNER_TEMP/synapse-signing/release.jks"

      - name: Build signed release APK
        if: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 != '' && secrets.SYNAPSE_KEYSTORE_PASSWORD != '' && secrets.SYNAPSE_KEY_ALIAS != '' && secrets.SYNAPSE_KEY_PASSWORD != '' }}
        env:
          SYNAPSE_KEYSTORE_PATH: ${{ runner.temp }}/synapse-signing/release.jks
          SYNAPSE_KEYSTORE_PASSWORD: ${{ secrets.SYNAPSE_KEYSTORE_PASSWORD }}
          SYNAPSE_KEY_ALIAS: ${{ secrets.SYNAPSE_KEY_ALIAS }}
          SYNAPSE_KEY_PASSWORD: ${{ secrets.SYNAPSE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Build debug APK (temporary fallback)
        if: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 == '' || secrets.SYNAPSE_KEYSTORE_PASSWORD == '' || secrets.SYNAPSE_KEY_ALIAS == '' || secrets.SYNAPSE_KEY_PASSWORD == '' }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload signed release APK
        if: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 != '' && secrets.SYNAPSE_KEYSTORE_PASSWORD != '' && secrets.SYNAPSE_KEY_ALIAS != '' && secrets.SYNAPSE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SynapseAI-stable-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK (temporary fallback)
        if: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 == '' || secrets.SYNAPSE_KEYSTORE_PASSWORD == '' || secrets.SYNAPSE_KEY_ALIAS == '' || secrets.SYNAPSE_KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SynapseAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
